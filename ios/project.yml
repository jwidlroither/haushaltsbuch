# XcodeGen-Spezifikation für die Haushaltsbuch iOS-App + Widget-Extension.
#
# Warum XcodeGen statt eines eingecheckten Haushaltsbuch.xcodeproj?
# project.pbxproj ist ein internes, teils binär-artiges Xcode-Format. Ohne Xcode/Swift-
# Toolchain (wie in der Umgebung, in der dieses Projekt erstellt wurde) lässt sich eine
# von Hand geschriebene .pbxproj-Datei nicht validieren – ein einziger falscher Verweis
# oder eine falsche UUID reicht, damit Xcode die Datei gar nicht erst öffnet. Das wäre
# schlechter als gar kein Projekt. XcodeGen erzeugt aus dieser (für Menschen lesbaren,
# reviewbaren, diff-baren) YAML-Datei + der Ordnerstruktur unter `ios/` deterministisch
# ein korrektes, standardkonformes .xcodeproj. Siehe README.md für die Installations-
# und Bau-Anleitung sowie eine manuelle Fallback-Option ohne XcodeGen.

name: Haushaltsbuch

options:
  bundleIdPrefix: at.tumpenhasi
  deploymentTarget:
    iOS: "17.0"
  # SwiftUI-App-Lifecycle, kein Storyboard/AppDelegate nötig.
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone primär, iPad optional (siehe Aufgabenstellung)
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM bewusst nicht gesetzt – muss pro Entwickler in Xcode unter
    # "Signing & Capabilities" mit dem eigenen (kostenlosen oder bezahlten) Apple-
    # Developer-Team ausgewählt werden, siehe README.md.
    ENABLE_PREVIEWS: YES

targets:
  Haushaltsbuch:
    type: application
    platform: iOS
    sources:
      - path: Haushaltsbuch
      - path: Shared
    info:
      path: Haushaltsbuch/Info.plist
    entitlements:
      path: Haushaltsbuch/Haushaltsbuch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.tumpenhasi.haushaltsbuch
        PRODUCT_NAME: Haushaltsbuch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: HaushaltsbuchWidget
        embed: true
        codeSignOnCopy: true

  HaushaltsbuchWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HaushaltsbuchWidget
      - path: Shared
    info:
      path: HaushaltsbuchWidget/Info.plist
    entitlements:
      path: HaushaltsbuchWidget/HaushaltsbuchWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.tumpenhasi.haushaltsbuch.widget
        PRODUCT_NAME: HaushaltsbuchWidget
        SKIP_INSTALL: YES

schemes:
  Haushaltsbuch:
    build:
      targets:
        Haushaltsbuch: all
        HaushaltsbuchWidget: all
    run:
      config: Debug
    archive:
      config: Release
