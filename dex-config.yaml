# Dex OIDC Provider - Lokale Entwicklungskonfiguration
# Nur für Entwicklung, NICHT für Produktion verwenden!
# Starten mit: docker-compose -f docker-compose.yml -f docker-compose.dev.yml --profile oidc-dev up

issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

logger:
  level: "debug"

oauth2:
  skipApprovalScreen: true
  responseTypes:
    - code

staticClients:
  - id: haushaltsbuch
    redirectURIs:
      - 'http://localhost:3001/api/auth/callback'
      - 'http://localhost/api/auth/callback'
    name: 'Haushaltsbuch'
    secret: dev-secret-change-in-production
    public: false

enablePasswordDB: true

staticPasswords:
  - email: "test@example.com"
    # Password: "password" (bcrypt hash)
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8F4u"
    username: "Test User"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
