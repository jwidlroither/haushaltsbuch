services:
  postgres:
    image: postgres:16-alpine
    container_name: haushaltsbuch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-haushaltsbuch}
      POSTGRES_USER: ${DB_USER:-haushalt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-haushalt} -d ${DB_NAME:-haushaltsbuch}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - haushaltsbuch-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haushaltsbuch-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-haushaltsbuch}
      DB_USER: ${DB_USER:-haushalt}
      DB_PASSWORD: ${DB_PASSWORD:-securepassword}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost/api/auth/callback}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - haushaltsbuch-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
        VITE_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
        VITE_OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost/api/auth/callback}
    container_name: haushaltsbuch-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - haushaltsbuch-net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  nginx:
    image: nginx:alpine
    container_name: haushaltsbuch-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - haushaltsbuch-net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

volumes:
  postgres_data:

networks:
  haushaltsbuch-net:
    driver: bridge
